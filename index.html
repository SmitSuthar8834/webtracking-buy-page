<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tatvika Works — Get Started</title>
<meta name="description" content="Test landing page for measuring buying intent.">

<meta property="og:type" content="website">

<meta property="og:image" content="https://webtracking.tatvikaworks.com/assets/og-image.png">

<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tatvika Works — Get Started">
<meta name="twitter:description" content="Test landing page for measuring buying intent.">

<style>
  :root {
    color-scheme: dark;
    --bg: #14141f;
    --bg-alt: #1c1c2c;
    --text: #f4f4f8;
    --text-dim: #a8a8c0;
    --accent: #6e6ef2;
    --accent-hover: #8484ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, var(--bg-alt), var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: clamp(28px, 5vw, 40px);
    margin: 0 0 12px;
  }
  p.sub {
    color: var(--text-dim);
    font-size: 17px;
    line-height: 1.5;
    margin: 0 0 32px;
  }
  button#buy-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 16px 32px;
    font-size: 17px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button#buy-btn:hover { background: var(--accent-hover); }
  button#buy-btn:active { transform: scale(0.97); }
  .confirm {
    display: none;
    margin-top: 20px;
    color: #8ce29b;
    font-size: 15px;
  }
  .confirm.visible { display: block; }
  footer {
    margin-top: 48px;
    font-size: 12px;
    color: #55556c;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Get Started with Tatvika Works</h1>
    <p class="sub">This is a test page for measuring buying intent. Click the button below to simulate a purchase click.</p>
    <button id="buy-btn">Buy Now</button>
    <div class="confirm" id="confirm-msg">Thanks — your interest has been recorded.</div>
    <footer>webtracking.tatvikaworks.com</footer>
  </div>

<script>
document.getElementById('buy-btn').addEventListener('click', function () {
  var count = parseInt(localStorage.getItem('buyIntentClicks') || '0', 10) + 1;
  localStorage.setItem('buyIntentClicks', String(count));
  console.log('buy_intent_click', { count: count, ts: new Date().toISOString() });
  document.getElementById('confirm-msg').classList.add('visible');
});
</script>
</body>
</html>
